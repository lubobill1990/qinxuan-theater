name: Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # golden 截图对字体渲染敏感，只在本地生成比对
      - run: flutter test --exclude-tags golden
      - run: flutter build windows --release

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.${{ github.run_number }} windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: qinxuan-theater-windows-setup
          path: dist/qinxuan-theater-setup.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qinxuan-theater-setup.exe
